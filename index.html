<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#14263f" />
    <title>WORDWHIRL</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #14263f;
            color: #fff8df;
            font-family: "Arial Rounded MT Bold", "Avenir Next", "Trebuchet MS", sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #root { position: fixed; inset: 0; }
        #boot-cover {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: linear-gradient(155deg, #102038 0%, #315e72 58%, #e7a172 100%);
            opacity: 1;
            transition: opacity .35s ease-out;
            pointer-events: none;
        }
        #boot-cover.hidden { opacity: 0; }
        .boot-cloud { position: absolute; width: 310px; height: 110px; border-radius: 55%; background: #f8ead2; opacity: .18; }
        .boot-cloud-a { top: 12%; left: -80px; transform: rotate(-7deg); }
        .boot-cloud-b { right: -95px; bottom: 15%; transform: rotate(8deg); }
        .boot-wind { position: absolute; inset: 18% -12%; border: 12px solid rgba(203, 250, 225, .18); border-right-color: transparent; border-left-color: transparent; border-radius: 50%; transform: rotate(-12deg); }
        .boot-card { width: min(76vw, 320px); text-align: center; filter: drop-shadow(0 18px 30px rgba(8, 21, 34, .34)); }
        .boot-compass { position: relative; width: 112px; height: 112px; margin: 0 auto 20px; border: 3px solid #d8f6e4; border-radius: 50%; background: rgba(16, 34, 55, .72); box-shadow: inset 0 0 0 9px rgba(216, 246, 228, .08); animation: drift 2.2s ease-in-out infinite; }
        .boot-compass::before, .boot-compass::after { content: ""; position: absolute; inset: 50% 13px auto; height: 3px; background: #d8f6e4; transform-origin: center; }
        .boot-compass::after { transform: rotate(60deg); }
        .boot-letter { position: absolute; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #f7edd5; color: #173249; font-weight: 1000; }
        .boot-letter:nth-child(1) { left: 38px; top: 7px; }
        .boot-letter:nth-child(2) { right: 10px; bottom: 15px; }
        .boot-letter:nth-child(3) { left: 10px; bottom: 15px; }
        .boot-title { margin: 0; color: #fff8df; font-size: 36px; letter-spacing: .12em; text-shadow: 0 3px 0 #1d4052; }
        .boot-subtitle { margin: 7px 0 23px; color: #d8f6e4; font-size: 12px; font-weight: 900; letter-spacing: .22em; }
        .boot-track { height: 13px; padding: 3px; overflow: hidden; border: 2px solid rgba(255,248,223,.72); border-radius: 999px; background: rgba(9,28,45,.38); }
        .boot-fill { width: 12%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #91dfc4, #ffd292); animation: loading 1.4s ease-in-out infinite; transition: width .18s ease-out; }
        #boot-cover.is-determinate .boot-fill { animation: none; }
        .boot-copy { margin: 12px 0 0; color: #f9ead2; font-size: 12px; font-weight: 900; letter-spacing: .1em; }
        @keyframes drift { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
        @keyframes loading { 0% { width: 12%; transform: translateX(0); } 50% { width: 52%; transform: translateX(45%); } 100% { width: 12%; transform: translateX(650%); } }
        @media (prefers-reduced-motion: reduce) { .boot-compass, .boot-fill { animation: none; } }
    </style>
</head>
<body>
    <div id="boot-cover" role="progressbar" aria-busy="true" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading Wordwhirl">
        <div class="boot-cloud boot-cloud-a"></div><div class="boot-cloud boot-cloud-b"></div><div class="boot-wind"></div>
        <div class="boot-card">
            <div class="boot-compass" aria-hidden="true"><span class="boot-letter">W</span><span class="boot-letter">O</span><span class="boot-letter">W</span></div>
            <h1 class="boot-title">WORDWHIRL</h1>
            <p class="boot-subtitle">CHASE THE WORDS</p>
            <div class="boot-track"><div class="boot-fill" id="boot-fill"></div></div>
            <p class="boot-copy" id="boot-copy">CHARTING THE SKY…</p>
        </div>
    </div>
    <script>setTimeout(function(){var c=document.getElementById('boot-cover');if(c&&!c.classList.contains('hidden'))c.classList.add('hidden')},30000)</script>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>
</html>
