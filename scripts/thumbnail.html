<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#173249;font-family:"Arial Rounded MT Bold","Avenir Next",sans-serif}
body{position:relative;background:linear-gradient(rgba(11,30,46,.06),rgba(11,30,46,.32)),url("../src/assets/art/wordwhirl-sky-wide.svg") center/cover}
.wind{position:absolute;inset:70px -100px;border:17px solid rgba(218,255,240,.24);border-left-color:transparent;border-right-color:transparent;border-radius:50%;transform:rotate(-12deg)}
.card{position:absolute;inset:52px;display:grid;place-items:center;text-align:center;filter:drop-shadow(0 20px 24px rgba(5,18,29,.38))}
.ring{position:relative;width:260px;height:260px;border:8px double #d9fff0;border-radius:50%;background:rgba(15,38,57,.82);box-shadow:0 0 0 14px rgba(216,255,240,.09),0 0 58px rgba(153,225,195,.3)}
.line{position:absolute;left:62px;top:128px;width:138px;height:9px;border-radius:9px;background:#99e1c3;transform:rotate(120deg);transform-origin:center}
.line:after{content:"";display:block;width:138px;height:9px;border-radius:9px;background:#99e1c3;transform:rotate(120deg)}
.letter{position:absolute;display:grid;width:82px;height:82px;place-items:center;border:5px solid #173249;border-radius:50%;background:#fff2d7;color:#173249;font-size:45px;font-weight:1000}
.a{left:86px;top:15px}.b{right:18px;bottom:30px}.c{left:18px;bottom:30px}
h1{position:absolute;right:-22px;bottom:-62px;left:-22px;margin:0;padding:12px 0;color:#fff2d7;font-size:55px;font-weight:1000;letter-spacing:.05em;text-shadow:0 5px 0 #1f4655}
</style></head><body><div class="wind"></div><div class="card"><div class="ring"><div class="line"></div><span class="letter a">W</span><span class="letter b">O</span><span class="letter c">W</span><h1>WORDWHIRL</h1></div></div></body></html>
